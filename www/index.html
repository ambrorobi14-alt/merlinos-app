    const calculateE1RM = (weight, reps, rpe) => {
      const w = parseFloat(weight) || 0;
      const r = parseInt(reps) || 0;
      const rpeVal = parseFloat(rpe) || 10;
      if (w <= 0 || r <= 0) return 0;
      
     const sortedRpes = Object.keys(RPE_CHART).map(Number).sort((a, b) => b - a);
      const rpeKey = rpeVal < 4 ? 4 : (sortedRpes.find(k => k <= rpeVal) || 10);
      const repKey = Math.min(Math.max(r, 1), 12);
      const pct = RPE_CHART[rpeKey] ? RPE_CHART[rpeKey][repKey] : null;

      if (!pct) return Math.round(w * (1 + r / 30));
      return Math.round((w / pct) * 100);
    };

    const computeWeeklyTrendsFromLogs = (logsList, weeksArray) => {
      const rawWeeks = weeksArray.map(wNum => {
        const weekLogs = logsList.filter(l => l.weekNum === wNum || l.week === `W${wNum}`);
        if (weekLogs.length === 0) {
          return { week: `W${wNum}`, weekNum: wNum, tonnage: 0, srpe: 0, percent1RM: 0, monotony: 0, hooper: 0, acwr: 0, setsCount: 0 };
        }

        const weekTonnage = weekLogs.reduce((sum, l) => sum + (l.tonnage || 0), 0);
        const avgPercent = Math.round(weekLogs.reduce((sum, l) => sum + (l.percent1RM || 0), 0) / weekLogs.length);
        const lastHooper = weekLogs[weekLogs.length - 1].hooper || 0;

        const sessionsMap = {};
        weekLogs.forEach(l => {
          const sKey = l.trainingDate || l.day || 'Seduta';
          if (!sessionsMap[sKey]) sessionsMap[sKey] = { rpes: [], duration: l.sessionDurationMinutes || 60 };
          sessionsMap[sKey].rpes.push(parseFloat(l.actualRpe || l.rpe) || 0);
          if (l.sessionDurationMinutes) sessionsMap[sKey].duration = l.sessionDurationMinutes;
        });

        const dailyLoads = Object.values(sessionsMap).map(s => {
          const avgSessionRpe = s.rpes.reduce((a, b) => a + b, 0) / (s.rpes.length || 1);
          return Math.round(avgSessionRpe * s.duration);
        });

        const weeksRPE = dailyLoads.reduce((a, b) => a + b, 0);
        const sevenDaysLoads = [...dailyLoads];
        while (sevenDaysLoads.length < 7) sevenDaysLoads.push(0);
        const slice7 = sevenDaysLoads.slice(0, 7);

        const mean7 = slice7.reduce((a, b) => a + b, 0) / 7;
        const variance7 = slice7.reduce((a, b) => a + Math.pow(b - mean7, 2), 0) / 7;
        const stdDev7 = Math.sqrt(variance7);
        const monotony = stdDev7 > 0 ? parseFloat((mean7 / stdDev7).toFixed(2)) : 0;

        return {
          week: `W${wNum}`,
          weekNum: wNum,
          tonnage: weekTonnage,
          srpe: weeksRPE,
          percent1RM: avgPercent,
          monotony,
          hooper: lastHooper,
          acwr: 0,
          setsCount: weekLogs.length
        };
      });

      return rawWeeks.map((curr, idx) => {
        if (curr.srpe === 0) return curr;
        const windowStart = Math.max(0, idx - 3);
        const activeWindow = rawWeeks.slice(windowStart, idx + 1).filter(w => w.srpe > 0);
        const chronicMean = activeWindow.reduce((sum, w) => sum + w.srpe, 0) / (activeWindow.length || 1);
        const acwr = chronicMean > 0 ? parseFloat((curr.srpe / chronicMean).toFixed(2)) : 1.0;
        return { ...curr, acwr };
      });
    };

    const ExcelLineChart = ({ title, dataKey, color, data, unit = '', scienceKey = null }) => {
      const [showInfo, setShowInfo] = useState(false);
      const science = scienceKey ? CHART_SCIENTIFIC_DOCS[scienceKey] : null;

      const chartHeight = 90;
      const values = data.map(d => parseFloat(d[dataKey]) || 0);
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = maxVal - minVal === 0 ? 1 : maxVal - minVal;

      const toggleInfo = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (science) setShowInfo(prev => !prev);
      };

      return (
        <div className="relative bg-slate-950/80 border border-slate-800 p-4 rounded-xl shadow-md space-y-2">
          <div
            onClick={toggleInfo}
            className={`relative z-30 flex items-center justify-between gap-2 ${science ? 'cursor-pointer select-none' : ''}`}

              <span>{title}</span>
            </div>
            {science && (
              <button
                type="button"
                onClick={toggleInfo}
                className={`relative z-30 px-3 py-1.5 rounded-lg text-xs font-black border transition-all cursor-pointer touch-manipulation ${
                  showInfo
                    ? 'bg-cyan-500 text-black border-cyan-400'
                    : 'bg-slate-900 text-cyan-400 border-slate-700 hover:border-cyan-400 active:scale-95'
                }`}
              >
                ⓘ {showInfo ? 'Chiudi' : 'Info'}
              </button>
            )}
          </div>

            <div className="relative z-20 bg-slate-900/95 border border-cyan-500/30 rounded-xl p-3 text-[11px] space-y-1.5 text-slate-300">

              <div><strong className="text-slate-400">Formula:</strong> <code className="text-emerald-300">{science.formula}</code></div>
              <div><strong className="text-slate-400">Significato:</strong> {science.meaning}</div>
              <div className="text-amber-300/90"><strong>Soglie:</strong> {science.thresholds}</div>
            </div>
          )}

          <div className="relative z-10 h-[100px] border-l border-b border-slate-800 pt-4 pb-2 px-2 flex justify-around items-end">
            {data.map((item, i) => {
              const val = parseFloat(item[dataKey]) || 0;
              const normalizedHeight = Math.max(12, ((val - minVal) / range) * 60);
              return (
                <div key={i} className="flex flex-col items-center flex-1">
                  <span className="text-[10px] font-bold mb-1" style={{ color }}>{val}{unit}</span>
                  <div className="relative flex flex-col justify-end items-center" style={{ height: `${chartHeight}px` }}>
                    <div className="w-1 rounded-t opacity-40" style={{ height: `${normalizedHeight}px`, backgroundColor: color }} />

                  </div>
                  <span className="text-[10px] font-medium text-slate-400 mt-2">{item.week}</span>
                </div>
              );
            })}
          </div>
        </div>
      );

    // Calcola la posizione nel ciclo e la fase (1..4) per una data ISO (YYYY-MM-DD)
    const getCycleDayInfo = (dateISO, cycleConfig) => {
      if (!cycleConfig || !cycleConfig.cycleStartDate) return null;
      const startUTC = parseISODateUTC(cycleConfig.cycleStartDate);
      const targetUTC = parseISODateUTC(dateISO);
      if (startUTC === null || targetUTC === null) return null;

      const totalLength = Math.max(20, Math.min(45, parseInt(cycleConfig.cycleLength) || 28));
      const periodLength = Math.max(1, Math.min(12, parseInt(cycleConfig.periodLength) || 7));

      const diffDays = Math.floor((targetUTC - startUTC) / 86400000);
      // Modulo positivo anche per date precedenti a cycleStartDate
      const zeroBasedDay = ((diffDays % totalLength) + totalLength) % totalLength;
      const cycleDay = zeroBasedDay + 1; // 1 .. totalLength
      const daysUntilNext = totalLength - cycleDay + 1;

      // Ripartizione dinamica delle 4 fasi su totalLength e periodLength
      // Default 28 / 7 => 1-7 (Fase 1), 8-14 (Fase 2), 15-21 (Fase 3), 22-28 (Fase 4)
      const remainingDays = Math.max(3, totalLength - periodLength);
      const pmsLength = Math.max(4, Math.min(8, Math.round(totalLength * 0.25))); // ~7 gg su 28
      const nonPmsRemaining = Math.max(2, remainingDays - pmsLength);
      const follicularLength = Math.max(1, Math.floor(nonPmsRemaining / 2));
      const lutealLength = Math.max(1, nonPmsRemaining - follicularLength);

      const endPhase1 = periodLength;
      const endPhase2 = endPhase1 + follicularLength;
      const endPhase3 = endPhase2 + lutealLength;

      let phaseNum = 4;
      if (cycleDay <= endPhase1) phaseNum = 1;
      else if (cycleDay <= endPhase2) phaseNum = 2;
      else if (cycleDay <= endPhase3) phaseNum = 3;
      else phaseNum = 4;

      return {
        cycleDay,
        totalLength,
        periodLength,
        daysUntilNext,
        phaseNum,
        phase: PHASE_STYLES[phaseNum],
        isBeforeAnchor: diffDays < 0
      };
    };

    // Simulazione Monte Carlo per riempire i giorni mancanti e proiettare il peso
    const runMonteCarloWeightSimulation = (year, month, bwData, cycleConfig) => {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const weightsMap = (bwData && bwData.weights) || {};
      const weekPlans = (bwData && bwData.weekPlans) || {};

      const sortedEntries = Object.entries(weightsMap)
        .filter(([_, val]) => !isNaN(parseFloat(val)) && parseFloat(val) > 0)
        .map(([iso, val]) => ({ iso, val: parseFloat(val) }))
        .sort((a, b) => a.iso.localeCompare(b.iso));

      if (sortedEntries.length === 0) return {};

      let dailyVol = 0.35;
      if (sortedEntries.length >= 2) {
        const diffs = [];
        for (let i = 1; i < sortedEntries.length; i++) {
          const d1 = parseISODateUTC(sortedEntries[i - 1].iso);
          const d2 = parseISODateUTC(sortedEntries[i].iso);
          const gap = Math.max(1, Math.round((d2 - d1) / 86400000));
          if (gap <= 7) {
            diffs.push((sortedEntries[i].val - sortedEntries[i - 1].val) / Math.sqrt(gap));
          }
        }
        if (diffs.length > 0) {
          const meanDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
          const variance = diffs.reduce((a, b) => a + Math.pow(b - meanDiff, 2), 0) / diffs.length;
          dailyVol = Math.max(0.18, Math.min(0.85, Math.sqrt(variance)));
        }
      }

      let seed = year * 100 + month + sortedEntries.length * 17;
      const seededRand = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
      const randNormal = () => {
        const u1 = Math.max(1e-6, seededRand());
        const u2 = seededRand();
        return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      };

      const avgWeight = sortedEntries.reduce((s, e) => s + e.val, 0) / sortedEntries.length;
      const estMaintenanceKcal = avgWeight * 31;

      const N_SIMS = 300;
      const trajectories = Array.from({ length: N_SIMS }, () => ({}));

      const monthStartISO = `${year}-${String(month + 1).padStart(2, '0')}-01`;
      const priorEntries = sortedEntries.filter(e => e.iso <= monthStartISO);
      let baseStartWeight = priorEntries.length > 0
        ? priorEntries[priorEntries.length - 1].val
        : sortedEntries[0].val;

      for (let sim = 0; sim < N_SIMS; sim++) {
        let currW = baseStartWeight;

        for (let d = 1; d <= daysInMonth; d++) {
          const dateISO = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const realW = weightsMap[dateISO] !== undefined && weightsMap[dateISO] !== ''
            ? parseFloat(weightsMap[dateISO])
            : null;

          if (realW !== null && !isNaN(realW)) {
            currW = realW;
            trajectories[sim][dateISO] = realW;
          } else {
            const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
            const weekIdx = Math.floor((d - 1 + firstDow) / 7) + 1;
            const wKey = `${year}-${String(month + 1).padStart(2, '0')}-W${weekIdx}`;
            const plan = weekPlans[wKey];

            let dailyDelta = 0;
            if (plan && parseFloat(plan.kcal) > 0) {
              const kcalDiff = parseFloat(plan.kcal) - estMaintenanceKcal;
              dailyDelta = kcalDiff / 7700;
            }

            let cycleShift = 0;
            if (cycleConfig && cycleConfig.isFemale && cycleConfig.cycleStartDate) {
              const cInfo = getCycleDayInfo(dateISO, cycleConfig);
              if (cInfo && cInfo.phaseNum === 4) cycleShift = 0.04;
              if (cInfo && cInfo.phaseNum === 2) cycleShift = -0.03;
            }

            const nextReal = sortedEntries.find(e => e.iso > dateISO);
            let pull = 0;
            if (nextReal) {
              const daysAhead = Math.max(1, Math.round((parseISODateUTC(nextReal.iso) - parseISODateUTC(dateISO)) / 86400000));
              if (daysAhead <= 14) {
                pull = (nextReal.val - currW) / (daysAhead * 1.4);
              }
            }

            currW = currW + dailyDelta + cycleShift + pull + randNormal() * (dailyVol * 0.65);
            trajectories[sim][dateISO] = currW;
          }
        }
      }

      const result = {};
      for (let d = 1; d <= daysInMonth; d++) {
        const dateISO = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const vals = trajectories.map(t => t[dateISO]).sort((a, b) => a - b);
        const p15 = vals[Math.floor(N_SIMS * 0.15)];
        const p50 = vals[Math.floor(N_SIMS * 0.50)];
        const p85 = vals[Math.floor(N_SIMS * 0.85)];
        result[dateISO] = {
          sim: p50.toFixed(1),
          low: p15.toFixed(1),
          high: p85.toFixed(1)
        };
      }
      return result;
    };

          if (file.size <= 8 * 1024 * 1024 || typeof MediaRecorder === 'undefined') {
            resolve(file);
            return;
          }

          let settled = false;
          let activeRecorder = null;
          let activeRafId = null;

          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;
          const objectUrl = URL.createObjectURL(file);

          const safeResolve = (resFile) => {
            if (settled) return;
            settled = true;
            clearTimeout(fallbackTimer);
            if (activeRafId) cancelAnimationFrame(activeRafId);
            try { video.pause(); } catch (_) {}
            try {
              if (activeRecorder && activeRecorder.state !== 'inactive') activeRecorder.stop();
            } catch (_) {}
            URL.revokeObjectURL(objectUrl);
            resolve(resFile);
          };

          const fallbackTimer = setTimeout(() => {
            safeResolve(file);
          }, 15000);
          video.src = objectUrl;

          video.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            safeResolve(file);
          };

          video.onloadedmetadata = () => {
            const maxSide = 720;
            let width = video.videoWidth || 720;
            let height = video.videoHeight || 1280;

            if (width > maxSide || height > maxSide) {
              if (width >= height) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              } else {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            // Dimensioni pari obbligatorie per i codec video
            width = width - (width % 2);
            height = height - (height % 2);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            if (!canvas.captureStream) {
              URL.revokeObjectURL(objectUrl);
              resolve(file);
              return;
            }

            const mimeTypes = [
              'video/mp4;codecs=avc1',
              'video/mp4',
              'video/webm;codecs=vp9',
              'video/webm;codecs=vp8',
              'video/webm'
            ];
            const selectedMime = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';

            const stream = canvas.captureStream(30);
            let recorder;
            try {
              recorder = new MediaRecorder(stream, {
                ...(selectedMime ? { mimeType: selectedMime } : {}),
                videoBitsPerSecond: 1200000 // 1.2 Mbps = ~4.5 MB ogni 30 secondi
              });
            } catch (e) {
              URL.revokeObjectURL(objectUrl);
              resolve(file);
              return;
            }

            const chunks = [];
            recorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
              URL.revokeObjectURL(objectUrl);
              const finalType = selectedMime || 'video/mp4';
              const ext = finalType.includes('webm') ? 'webm' : 'mp4';
              const blob = new Blob(chunks, { type: finalType });
              if (blob.size > 0 && blob.size < file.size) {
                resolve(new File([blob], `video_compresso.${ext}`, { type: finalType }));
              } else {
                resolve(file);
              }
            };

          activeRecorder = recorder;
            const drawFrame = () => {
              if (settled || video.paused || video.ended) return;
              ctx.drawImage(video, 0, 0, width, height);
              if (onProgress && video.duration > 0 && !settled) {
                onProgress(Math.min(99, Math.round((video.currentTime / video.duration) * 100)));
              }
              activeRafId = requestAnimationFrame(drawFrame);
            };

            video.onended = () => {
              if (activeRafId) cancelAnimationFrame(activeRafId);
              if (recorder.state !== 'inactive') recorder.stop();
            };

            recorder.start(500);
            video.play().then(() => {
              drawFrame();
            }).catch(() => {
              if (activeRafId) cancelAnimationFrame(activeRafId);
              if (recorder.state !== 'inactive') recorder.stop();
              safeResolve(file);
            });
          };
        });
      };

const handleUploadExerciseVideo = async (file, exItem) => {
  if (!file || !exItem) return;

  const CLOUDINARY_CLOUD_NAME = "m4ivwq6f";
  const CLOUDINARY_UPLOAD_PRESET = "video_app";

  if (file.size === 0) {
    alert("Il telefono ha restituito un file vuoto (0 byte). Controlla i permessi Media/Video dell'app.");
    return;
  }
  if (file.size > 120 * 1024 * 1024) {
    alert("Il video originale supera i 120 MB. Taglia la clip a max 45-60 secondi prima di inviarla.");
    return;
  }

  const safeAth = getAthleteDocId(currentActiveTarget);
  const wNum = exItem.weekNum || activeDisplayWeek || 1;

  setUploadingVideoExId(exItem.id);
  setVideoUploadProgress(1);

  const fileToUpload = await compressVideoOnPhone(file, (compPct) => {
    setVideoUploadProgress(Math.max(1, Math.round(compPct * 0.5)));
  });

  const formData = new FormData();
  formData.append("file", fileToUpload);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  formData.append("folder", `exercise_videos/${safeAth}/W${wNum}`);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`, true);

  xhr.upload.onprogress = (event) => {
    if (event.lengthComputable && event.total > 0) {
      const upPct = Math.round((event.loaded / event.total) * 50);
      setVideoUploadProgress(Math.min(99, 50 + upPct));
    }
  };

  xhr.onload = async () => {
    try {
      if (xhr.status >= 200 && xhr.status < 300) {
        const response = JSON.parse(xhr.responseText);
        const downloadURL = response.secure_url;
        const publicId = response.public_id || "";
        const bytes = Number(response.bytes) || fileToUpload.size || 0;
        const duration = Number(response.duration) || 0;

        setAthleteVideoUrl(downloadURL);

        if (db) {
          const existing = athleteLogs.filter(l =>
            l.athlete.toLowerCase() === currentActiveTarget.toLowerCase() &&
            (l.week === `W${wNum}` || l.weekNum === wNum) &&
            l.exercise.toLowerCase() === exItem.exercise.toLowerCase()
          );
          for (const logDoc of existing) {
            if (logDoc.id) {
              await db.collection('logs').doc(logDoc.id).update({ userVideoUrl: downloadURL });
            }
          }

          await db.collection('athlete_videos').add({
            athlete: currentActiveTarget.trim(),
            athleteEmail: getAthleteTechEmail(currentActiveTarget),
            weekNum: wNum,
            week: `W${wNum}`,
            day: exItem.day || "",
            exercise: exItem.exercise,
            secureUrl: downloadURL,
            publicId,
            bytes,
            duration,
            uploadedAt: Date.now(),
            uploadedDateISO: getTodayISO(),
            notesSnapshot: athleteNotes || ""
          });
        }
      } else {
        let errMsg = `Errore HTTP ${xhr.status}`;
        try {
          const errJson = JSON.parse(xhr.responseText);
          if (errJson.error && errJson.error.message) errMsg = errJson.error.message;
        } catch (_) {}
        alert(`Caricamento Cloudinary fallito: ${errMsg}`);
      }
    } finally {
      setUploadingVideoExId(null);
      setVideoUploadProgress(0);
    }
  };

  xhr.onerror = () => {
    setUploadingVideoExId(null);
    setVideoUploadProgress(0);
    alert("Errore di rete durante l'invio a Cloudinary. Controlla la connessione Internet.");
  };

  xhr.send(formData);
};

          kcal: '2400',

          protein: '175'
        };
        const updatedPlan = { ...prevPlan, [field]: rawVal };

        if (field === 'carbs' || field === 'fats' || field === 'protein') {
          const c = parseFloat(field === 'carbs' ? rawVal : updatedPlan.carbs) || 0;
          const f = parseFloat(field === 'fats' ? rawVal : updatedPlan.fats) || 0;
          const p = parseFloat(field === 'protein' ? rawVal : updatedPlan.protein) || 0;
          updatedPlan.kcal = Math.round(c * 4 + f * 9 + p * 4).toString();
        } else if (field === 'kcal') {
          const newKcal = parseFloat(rawVal) || 0;

          if (oldKcal > 0 && newKcal > 0) {
            const ratio = newKcal / oldKcal;
            updatedPlan.carbs = Math.round((parseFloat(prevPlan.carbs) || 0) * ratio).toString();
            updatedPlan.fats = Math.round((parseFloat(prevPlan.fats) || 0) * ratio).toString();

          ...current,
          athlete: athName.trim(),

          weekPlans: {

            [weekKey]: updatedPlan
          },
          updatedAt: Date.now()

          const next = { ...prev, [key]: updated };

      const handleGenerateNextWeek = (athName, currentW) => {
        const nextW = currentW + 1;

          return;
        }

        const sourceProto = protocol
          .filter(p => p.athlete.toLowerCase() === athName.toLowerCase() && (p.weekNum || 1) === currentW)
          .sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));

        if (sourceProto.length === 0) {
          alert(`Nessun esercizio presente nella Settimana ${currentW} da duplicare.`);

        const daysList = Array.from(new Set(sourceProto.map(p => p.day)));

            ? { ...item.emomData }
            : null;

     const exLogsW = athleteLogs
            .filter(l =>
              l.athlete.toLowerCase() === athName.toLowerCase() &&
              (l.weekNum === currentW || l.week === `W${currentW}`) &&
              (!l.day || l.day === item.day) &&
              l.exercise.toLowerCase() === item.exercise.toLowerCase()
            )
            .sort((a, b) => a.setNumber - b.setNumber);

          const loggedSummary = exLogsW.length > 0
            ? exLogsW.map(l => `${l.reps}x${l.weight}kg @${l.actualRpe || l.rpe}`).join(' | ')
            : null;

      const updatePreviewSetField = (previewId, setIdx, field, value) => {

              if (it._previewId !== previewId || !it.detailedSets) return it;
              const nextSets = it.detailedSets.map((s, idx) => {
                if (idx !== setIdx) return s;
                if (field === 'targetWeight') {

              });
              return { ...it, detailedSets: nextSets };

              return { ...it, detailedSets: currentSets };

      const removePreviewSetRow = (previewId, setIdx) => {

      const handleArchiveAthleteProtocol = async (athName) => {
        if (!athName) return;
        const athKey = athName.toLowerCase().trim();

        const athProto = protocol.filter(p => p.athlete.toLowerCase().trim() === athKey);
        const athLogs = athleteLogs.filter(l => l.athlete.toLowerCase().trim() === athKey);

        if (athProto.length === 0 && athLogs.length === 0) {
          alert(`Nessun protocollo o allenamento registrato per "${athName}" da archiviare.`);
          return;
        }

        const athWeeksCount = getAthleteProgramConfig(athName).protocolWeeks || 4;
        const athWeeksArray = Array.from({ length: athWeeksCount }, (_, i) => i + 1);
        const defaultLabel = `Blocco ${athWeeksCount} Settimane (${formatItalianDate(getTodayISO())})`;
        const customTitle = prompt(
          `Inserisci un nome/etichetta per il Report Archivio di ${athName}:`,
          defaultLabel
        );
        if (customTitle === null) return;

        // 1. Massimali Reali 1RM al momento dell'archiviazione
        const savedMaxes = athleteMaxesMap[athKey] || { squat: '140', bench: '100', deadlift: '180' };
        const realMaxesSnapshot = {
          squat: parseFloat(savedMaxes.squat) || 0,
          bench: parseFloat(savedMaxes.bench) || 0,
          deadlift: parseFloat(savedMaxes.deadlift) || 0,
          total: (parseFloat(savedMaxes.squat) || 0) + (parseFloat(savedMaxes.bench) || 0) + (parseFloat(savedMaxes.deadlift) || 0)
        };

        // 2. Calcolo Massimali Settimanali Powerlifting (e1RM W1..W4)
        const plExNames = Array.from(new Set(
          athProto
            .filter(itemInProto => getPowerliftingCategory(itemInProto.exercise, itemInProto.dbId) !== null)
            .map(p => p.exercise)
        ));

        const powerliftingE1RMSnapshot = plExNames.map(exName => {
          const itemInProto = athProto.find(p => p.exercise === exName);
          const category = getPowerliftingCategory(exName, itemInProto.dbId);

          const weeksData = athWeeksArray.map(wNum => {
            const logsForExAndWeek = athLogs.filter(l =>
              l.exercise.toLowerCase() === exName.toLowerCase() &&
              (l.weekNum === wNum || l.week === `W${wNum}`)
            );
            if (logsForExAndWeek.length === 0) return 0;
            const e1rmList = logsForExAndWeek.map(l => calculateE1RM(l.weight, l.reps, l.actualRpe || l.rpe || 8));
            return Math.max(...e1rmList, 0);
          });

          return {
            exercise: exName,
            category,
            w1: weeksData[0] || 0,
            w2: weeksData[1] || 0,
            w3: weeksData[2] || 0,
            w4: weeksData[3] || 0,
            weeksData,
            chartData: athWeeksArray.map((wNum, idx) => ({ week: `W${wNum}`, e1RM: weeksData[idx] || 0 }))
          };
        });

        // 3. Calcolo Trend & Analisi Settimanali (W1..Wn)
        const weeklyTrendsSnapshot = computeWeeklyTrendsFromLogs(athLogs, athWeeksArray);

        // 4. Calcolo Volume Muscolare (Serie e %)
        const muscleVolumeSnapshot = {};
        DETAILED_MUSCLE_GROUPS.forEach(m => { muscleVolumeSnapshot[m] = 0; });
        if (athLogs.length > 0) {
          athLogs.forEach(l => {
            if (muscleVolumeSnapshot[l.primary] !== undefined) muscleVolumeSnapshot[l.primary] += 1;
          });
        } else {
          athProto.forEach(p => {
            const setsCount = p.detailedSets ? p.detailedSets.length : (p.emomData ? parseInt(p.emomData.minutes) || 10 : 4);
            if (muscleVolumeSnapshot[p.primary] !== undefined) muscleVolumeSnapshot[p.primary] += setsCount;
            if (muscleVolumeSnapshot[p.secondary] !== undefined) muscleVolumeSnapshot[p.secondary] += setsCount * 0.6;
            if (muscleVolumeSnapshot[p.tertiary] !== undefined) muscleVolumeSnapshot[p.tertiary] += setsCount * 0.3;
          });
        }

        // 5. Giorni Completati & Riepilogo Numerico
        const completedDaysSnapshot = {};
        Object.entries(completedDaysMap).forEach(([k, val]) => {
          if (k.toLowerCase().startsWith(`${athKey}_`) && val === true) {
            completedDaysSnapshot[k] = true;
          }
        });

        const totalTonnage = weeklyTrendsSnapshot.reduce((acc, w) => acc + (w.tonnage || 0), 0);
        const totalSRPE = weeklyTrendsSnapshot.reduce((acc, w) => acc + (w.srpe || 0), 0);
        const plannedDaysSet = new Set(athProto.map(p => `W${p.weekNum || 1}_${p.day}`));

        const sanitizeForFirestore = (obj) => JSON.parse(JSON.stringify(obj));

        const reportPayload = sanitizeForFirestore({
          athlete: athName.trim(),
          athleteEmail: getAthleteTechEmail(athName),
          title: sanitizeText(customTitle, 100) || defaultLabel,
          archivedAt: Date.now(),
          archivedDateISO: getTodayISO(),
          summary: {
            totalTonnage,
            totalSRPE,
            totalSetsLogged: athLogs.length,
            completedDaysCount: Object.keys(completedDaysSnapshot).length,
            plannedDaysCount: plannedDaysSet.size
          },
          realMaxes: realMaxesSnapshot,
          powerliftingE1RM: powerliftingE1RMSnapshot,
          weeklyTrends: weeklyTrendsSnapshot,
          muscleVolume: muscleVolumeSnapshot,
          rationaleSnapshot: getAthleteRationale(athName),
          protocolSnapshot: athProto,
          logsSnapshot: athLogs,
          completedDaysSnapshot
        });

        try {
          let savedId = 'arch_' + Date.now();
          let savedToCloud = false;
          let cloudPermError = null;

          if (db) {
            const activeEmail = (auth?.currentUser?.email || '').toLowerCase();
            if (activeEmail !== COACH_EMAIL.toLowerCase()) {
              alert("Sessione Coach scaduta o non autenticata su Firebase. Effettua nuovamente l'accesso Coach e riprova.");
              return;
            }
            try {
              const docRef = await db.collection('archived_protocols').add(reportPayload);
              savedId = docRef.id;
              savedToCloud = true;
            } catch (cloudErr) {
              if (cloudErr.code === 'permission-denied' || (cloudErr.message && cloudErr.message.toLowerCase().includes('permission'))) {
                cloudPermError = cloudErr;
              } else {
                throw cloudErr;
              }
            }
          }

          const fullReportObj = { id: savedId, ...reportPayload };
          setArchivedProtocols(prev => {
            const next = [fullReportObj, ...prev.filter(item => item.id !== savedId)];
            localStorage.setItem('merlinos_archived_protocols', JSON.stringify(next));
            return next;
          });

          const archiveStatusHeader = savedToCloud
            ? `Protocollo e Report di "${athName}" archiviati su Firebase Cloud e in locale!`
            : cloudPermError
              ? `⚠️ Report di "${athName}" salvato in LOCALSTORAGE su questo browser (su Firebase mancano ancora le Rules per "archived_protocols").`
              : `Protocollo e Report di "${athName}" archiviati localmente!`;

      const shouldResetActive = confirm(
          `${archiveStatusHeader}\n\n` +
          `Vuoi SVUOTARE ora le ${athWeeksCount} settimane attive (scheda, serie registrate e giorni completati) di ${athName} per iniziare un nuovo mesociclo pulito?\n\n` +
          `• OK = Svuota scheda attiva di ${athName}\n` +
          `• Annulla = Mantieni la scheda attiva attuale`
        );

          if (shouldResetActive) {
           if (db) {
              const cleanTarget = athName.trim();
              const targetEmail = getAthleteTechEmail(athName);

              for (const colName of ['protocols', 'logs', 'completed_days']) {
                const byName = await db.collection(colName).where('athlete', '==', cleanTarget).get();
                for (const d of byName.docs) await d.ref.delete();

                const byEmail = await db.collection(colName).where('athleteEmail', '==', targetEmail).get();
                for (const d of byEmail.docs) await d.ref.delete();
              }
            }

            setSubmittedSessionsMap(prev => {
              const next = { ...prev };
              Object.keys(next).forEach(k => {
                if (k.toLowerCase().startsWith(`${athKey}_`)) delete next[k];
              });
              localStorage.setItem('merlinos_submitted_sessions', JSON.stringify(next));
              return next;
            });

          setSessionTimersMap(prev => {
              const next = { ...prev };
              Object.keys(next).forEach(k => {
                if (k.toLowerCase().startsWith(`${athKey}_`)) delete next[k];
              });
              localStorage.setItem('merlinos_session_timers', JSON.stringify(next));
              return next;
            });

            setCompletedDaysMap(prev => {
              const next = { ...prev };
              Object.keys(next).forEach(k => {
                if (k.toLowerCase().startsWith(`${athKey}_`)) delete next[k];
              });
              localStorage.setItem('gym_completed_days', JSON.stringify(next));
              return next;

          }

          setSelectedArchiveReport(fullReportObj);
          setArchiveAthleteFilter(athName);
          setArchiveWeekTab(1);
          setSelectedAthleteForCoach(athName);
          setCoachSubTab('archive');
        } catch (err) {
          alert(`Errore durante l'archiviazione: ${err.message}`);
        }
      };
const handleResetToFullDb = async () => {
        if (!confirm("Ripristinare il database predefinito da 137 esercizi? Eventuali esercizi personalizzati aggiunti verranno sovrascritti.")) return;
        setExerciseDb(EXCEL_FULL_DATABASE);

        if (db) {
          try {

            for (const d of snap.docs) await d.ref.delete();

          }
        }
        alert("Database da 137 esercizi ripristinato con successo!");
      };
      const handleDeleteArchiveReport = async (reportId) => {
        if (!confirm("Eliminare definitivamente questo report dall'Archivio? L'operazione non è reversibile.")) return;
        try {
          if (db && reportId && !reportId.startsWith('arch_')) {
            await db.collection('archived_protocols').doc(reportId).delete();
          }
          setArchivedProtocols(prev => {

            return next;

          if (selectedArchiveReport && selectedArchiveReport.id === reportId) {
            setSelectedArchiveReport(null);

        } catch (err) {
          alert(`Errore eliminazione report: ${err.message}`);

      const handleRenameArchiveReport = async (reportId, currentTitle) => {
        const newTitle = prompt("Modifica titolo del Report Archiviato:", currentTitle);
        if (!newTitle || !newTitle.trim()) return;
        const cleanTitle = sanitizeText(newTitle, 100);
        try {
          if (db && reportId && !reportId.startsWith('arch_')) {
            await db.collection('archived_protocols').doc(reportId).update({ title: cleanTitle });
          }
          setArchivedProtocols(prev => {

            localStorage.setItem('merlinos_archived_protocols', JSON.stringify(next));

          });
          if (selectedArchiveReport && selectedArchiveReport.id === reportId) {
            setSelectedArchiveReport(prev => ({ ...prev, title: cleanTitle }));
          }
        } catch (err) {
          alert(`Errore aggiornamento titolo: ${err.message}`);
        }
      };

      const activeAthleteProtocol = useMemo(() => {
        return protocol.filter(p => p.athlete.toLowerCase() === currentActiveTarget.toLowerCase());
      }, [protocol, currentActiveTarget]);

      const currentMaxWeek = useMemo(() => {
        if (activeAthleteProtocol.length === 0) return 1;
        return Math.max(...activeAthleteProtocol.map(p => p.weekNum || 1));
      }, [activeAthleteProtocol]);

      const activeDisplayWeek = selectedWeekFilter || currentMaxWeek;

      const currentWeekProtocol = useMemo(() => {
        return activeAthleteProtocol.filter(p => (p.weekNum || 1) === activeDisplayWeek);
      }, [activeAthleteProtocol, activeDisplayWeek]);

      const availableDays = useMemo(() => {
        const days = [];
        currentWeekProtocol.forEach(p => {

        });
        return days;
      }, [currentWeekProtocol]);

      useEffect(() => {

        }

      useEffect(() => {
        if (availableDays.length > 0) {

        } else if (selectedDayTab !== '') {
          setSelectedDayTab('');
        }
      }, [availableDays]);

      // Chiave univoca del timer della seduta attiva
      const currentSessionTimerKey = `${currentActiveTarget}_W${activeDisplayWeek}_${selectedDayTab}`;
      const activeTimerInfo = sessionTimersMap[currentSessionTimerKey] || null;

      // Sincronizza la durata visualizzata quando cambia giorno o settimana
      useEffect(() => {
        setIsDurationManual(false);
        const timer = sessionTimersMap[currentSessionTimerKey];
        if (timer && timer.startTime) {
          const endTs = timer.endTime || timer.startTime;
          const elapsedMins = Math.max(1, Math.round((endTs - timer.startTime) / 60000));
          setSessionDuration(elapsedMins.toString());
        } else {
          setSessionDuration('90');
        }
      }, [currentSessionTimerKey]);

      // Aggiorna in tempo reale la durata visualizzata tra la 1ª serie inserita e l'ultima serie inserita
      useEffect(() => {
        if (isDurationManual) return;
        const timer = sessionTimersMap[currentSessionTimerKey];
        if (timer && timer.startTime) {
          const endTs = timer.endTime || timer.startTime;
          const elapsedMins = Math.max(1, Math.round((endTs - timer.startTime) / 60000));
          setSessionDuration(elapsedMins.toString());
        }
      }, [sessionTimersMap, currentSessionTimerKey, isDurationManual]);

      // Avvia il conteggio alla 1ª serie inserita in generale nella seduta e aggiorna la fine ad ogni nuova serie inserita
      const recordSessionSetTimestamp = (dayName, weekNum) => {
        const key = `${currentActiveTarget}_W${weekNum}_${dayName}`;
        if (completedDaysMap[key]) return; // Seduta già chiusa: non alterare la durata
        const now = Date.now();
       setSessionTimersMap(prev => {
          const existing = prev[key];
          const isStaleSession = existing?.endTime && (now - existing.endTime > 4 * 60 * 60 * 1000);
          const startTs = (!isStaleSession && existing && existing.startTime) ? existing.startTime : now;
          const updated = {
            ...prev,
            [key]: { startTime: startTs, endTime: now }
          };
          localStorage.setItem('merlinos_session_timers', JSON.stringify(updated));
          return updated;
        });
      };

      const handleResetSessionTimer = () => {
        if (!confirm("Vuoi azzerare il cronometro automatico di questa seduta?")) return;
        setSessionTimersMap(prev => {
          const updated = { ...prev };
          delete updated[currentSessionTimerKey];
          localStorage.setItem('merlinos_session_timers', JSON.stringify(updated));
          return updated;
        });
        setIsDurationManual(false);
        setSessionDuration('90');
      };

      // Stato e ref per il salvataggio automatico delle serie prescritte
      const [autoSaveStatus, setAutoSaveStatus] = useState('idle'); // 'idle' | 'pending' | 'saving' | 'saved' | 'error'
      const isSavingSetsRef = useRef(false);
      const queuedAutoSaveRef = useRef(false);
      const lastSavedSignatureRef = useRef('');

      // Verifica che una singola serie abbia Peso (>= 0), Reps (> 0) e RPE (1..10) compilati

                        </div>

                        <div className="md:col-span-2">
                          <label className="text-[11px] font-bold text-slate-300 block mb-1">Note ed eventuali Feedback per il Coach:</label>
                          <input
                            type="text"
                            value={durationNotes}
                            onChange={(e) => setDurationNotes(e.target.value)}
                            placeholder="Es. Recuperi un po' più lunghi nello Squat..."
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white"
                          />
                        </div>
                      </div>
                    </div>

                    {/* RIEPILOGO AVANZAMENTO & INVIO SEDUTA AL COACH */}
                    <div className="pt-3 space-y-3">
                      {(() => {
                        const dayKey = `${currentActiveTarget}_W${activeDisplayWeek}_${selectedDayTab}`;
                        const isDayDone = completedDaysMap[dayKey] === true;
                        const subInfo = submittedSessionsMap[dayKey] || null;
                        const progress = getDayCompletionProgress(currentActiveTarget, activeDisplayWeek, selectedDayTab);
                        const pct = progress.totalSets > 0
                          ? Math.round((progress.completedSets / progress.totalSets) * 100)
                          : 0;

                        return (
                          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                            {/* Barra Progresso Seduta */}
                            <div className="space-y-1.5">
                              <div className="flex items-center justify-between text-xs">
                                <span className="font-black text-slate-300 uppercase tracking-wider">
                                  Avanzamento {selectedDayTab} (W{activeDisplayWeek})
                                </span>
                                <span className="font-mono font-black text-cyan-400">
                                  {progress.completedExercises}/{progress.totalExercises} Esercizi • {progress.completedSets}/{progress.totalSets} Serie ({pct}%)
                                </span>
                              </div>
                              <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                                <div
                                  className={`h-full transition-all duration-500 ${
                                    isDayDone ? 'bg-emerald-400' : 'bg-gradient-to-r from-cyan-400 to-emerald-400'
                                  }`}
                                  style={{ width: `${pct}%` }}
                                />
                              </div>
                            </div>

                            {/* Banner Stato Invio Automatico al Coach */}
                            {(isDayDone || progress.isAllComplete) ? (
                              <div className="bg-emerald-500/15 border border-emerald-500/40 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div className="space-y-1">
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="px-2.5 py-0.5 rounded-full bg-emerald-500 text-black text-[10px] font-black uppercase tracking-wider">
                                      ✓ COMPLETATO & INVIATO AUTOMATICAMENTE AL COACH
                                    </span>
                                    {subInfo?.submittedAt && (
                                      <span className="text-[11px] text-emerald-300 font-mono font-bold">
                                        Trasmesso alle {formatTimeHHMM(subInfo.submittedAt)} ({formatItalianDate(subInfo.submittedDateISO)})
                                      </span>
                                    )}
                                  </div>
                                  <p className="text-xs text-slate-200">
                                    Tonnellaggio: <strong className="text-cyan-300">{subInfo?.totalTonnage || 0} kg</strong> • Durata: <strong className="text-emerald-300">{subInfo?.sessionDurationMinutes || sessionDuration} min</strong> • Hooper: <strong className="text-amber-300">{subInfo?.hooper || '-'}/28</strong>
                                  </p>
                                </div>
                                <span className="text-[11px] text-emerald-300/80 font-medium shrink-0">
                                  Sincronizzazione live attiva
                                </span>
                              </div>
                            ) : (
                              <div className="bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 flex items-center justify-between gap-3">
                                <span className="text-xs text-slate-300">
                                  ⚡ Invio istantaneo al Coach al completamento di tutti gli esercizi di <strong className="text-white">{selectedDayTab}</strong>
                                </span>
                                <span className="text-[11px] font-mono font-bold text-cyan-400 shrink-0">
                                  {Math.max(0, progress.totalExercises - progress.completedExercises)} rimasti
                                </span>
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                )}

              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
